{% load static ui %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FermeApp{% endblock %} · FermeApp</title>
  <meta name="description" content="FermeApp : application web de gestion de ferme agro-pastorale (élevage, cultures, stocks, finances). Démo publique sans inscription.">
  <meta name="theme-color" content="#07101a">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="pub">
{% if messages %}<div class="toasts">{% for m in messages %}<div class="toast {{ m.tags }}">{% icon "info" 18 %}<span>{{ m }}</span><button type="button" aria-label="Fermer" data-close>{% icon "x" 16 %}</button></div>{% endfor %}</div>{% endif %}
{% block body %}{% endblock %}
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
