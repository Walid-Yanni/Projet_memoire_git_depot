{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — FermeApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  '#1e3a5f',
            lime:  '#7cb518',
            'lime-light': '#e8f5c8',
            'navy-dark':  '#162d4a',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* Fond bleu marine avec motif de losanges (diagonale) */
    body {
      background-color: #1e3a5f;
      background-image: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 28px,
        rgba(255,255,255,0.04) 28px,
        rgba(255,255,255,0.04) 30px
      ),
      repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 28px,
        rgba(255,255,255,0.04) 28px,
        rgba(255,255,255,0.04) 30px
      );
    }

    /* Supprime le contour bleu par défaut sur les inputs */
    input:focus { outline: none; }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center px-4">

  <!-- ── LOGO & TAGLINE ─────────────────────────────────── -->
  <div class="text-center mb-8">
    <h1 class="text-4xl font-extrabold tracking-tight">
      <span class="text-white">Ferme</span><span class="text-lime-400" style="color:#7cb518;">App</span>
    </h1>
    <p class="mt-2 text-sm italic" style="color: rgba(255,255,255,0.65);">
      Innovation numérique au service de l'agro-pastoral
    </p>
  </div>

  <!-- ── CARTE DE CONNEXION ─────────────────────────────── -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

    <!-- Header vert lime -->
    <div class="py-5 px-8 text-center" style="background-color: #7cb518;">
      <h2 class="text-2xl font-bold italic" style="color: #1e3a5f;">Connexion</h2>
    </div>

    <!-- Corps du formulaire -->
    <div class="px-8 py-8 space-y-5">

      <!-- Erreurs Django -->
      {% if form.errors %}
      <div class="px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
        Identifiant ou mot de passe incorrect.
      </div>
      {% endif %}

      <form method="post" action="{{ request.path }}" novalidate>
        {% csrf_token %}

        <!-- Nom d'utilisateur -->
        <div class="mb-5">
          <label class="block text-xs font-semibold tracking-widest uppercase mb-2"
                 style="color: #1e3a5f;">
            Nom d'utilisateur
          </label>
          <input
            type="text"
            name="username"
            id="id_username"
            placeholder="Ex: admin"
            autocomplete="username"
            value="{{ form.username.value|default:'' }}"
            required
            class="w-full px-4 py-3 rounded-lg border text-sm transition-all duration-200"
            style="border-color: #d1d5db; color: #1e3a5f;"
            onfocus="this.style.borderColor='#7cb518'; this.style.boxShadow='0 0 0 3px rgba(124,181,24,0.15)';"
            onblur="this.style.borderColor='#d1d5db'; this.style.boxShadow='none';"
          />
        </div>

        <!-- Mot de passe -->
        <div class="mb-6">
          <label class="block text-xs font-semibold tracking-widest uppercase mb-2"
                 style="color: #1e3a5f;">
            Mot de passe
          </label>
          <input
            type="password"
            name="password"
            id="id_password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            class="w-full px-4 py-3 rounded-lg border text-sm transition-all duration-200"
            style="border-color: #d1d5db; color: #1e3a5f;"
            onfocus="this.style.borderColor='#7cb518'; this.style.boxShadow='0 0 0 3px rgba(124,181,24,0.15)';"
            onblur="this.style.borderColor='#d1d5db'; this.style.boxShadow='none';"
          />
        </div>

        {% if next %}
          <input type="hidden" name="next" value="{{ next }}" />
        {% endif %}

        <!-- Bouton submit -->
        <button
          type="submit"
          class="w-full py-3.5 px-4 rounded-lg text-white font-semibold text-sm
                 transition-all duration-200 hover:brightness-110 active:scale-[0.98]
                 flex items-center justify-center gap-2 shadow-md"
          style="background-color: #7cb518;"
        >
          <span>→</span>
          <span>Accéder à la ferme</span>
        </button>
      </form>

      <!-- Mode démo -->
      <div class="mt-4 px-4 py-3 rounded-lg text-center text-sm"
           style="background-color: #e8f5c8; color: #1e3a5f;">
        Mode démo :&nbsp;
        <button onclick="fillDemo('admin')"
                class="font-semibold underline underline-offset-2 hover:opacity-75 transition-opacity cursor-pointer"
                style="color: #7cb518;">admin</button>
        &nbsp;ou&nbsp;
        <button onclick="fillDemo('employe')"
                class="font-semibold underline underline-offset-2 hover:opacity-75 transition-opacity cursor-pointer"
                style="color: #7cb518;">employe</button>
      </div>

    </div>
  </div>

  <!-- ── FOOTER ─────────────────────────────────────────── -->
  <p class="mt-10 text-xs tracking-widest uppercase" style="color: rgba(255,255,255,0.35);">
    Mémoire L3 Génie Logiciel — UAC — 2026
  </p>

  <script>
    function fillDemo(role) {
      document.getElementById('id_username').value = role;
      document.getElementById('id_password').value = role;
    }
  </script>
</body>
</html>
